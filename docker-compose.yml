services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: taprime
      POSTGRES_PASSWORD: taprime
      POSTGRES_DB: taprime
    volumes:
      - taprime_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taprime"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  taprime_db_data:
